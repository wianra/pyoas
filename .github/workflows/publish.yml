name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish dist/*

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog section
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          BODY=$(awk -v tag="$TAG" '
            index($0, "## " tag " ") == 1 { found=1; next }
            found && /^## /              { exit }
            found
          ' CHANGELOG.md)

          # First non-internal bullet → subtitle (skip **wpN** lines)
          FIRST=$(echo "$BODY" | grep '^- ' | grep -v '\*\*wp[0-9]' | head -1 \
                  | sed 's/^- \*\*[^*]*\*\*: *//' | sed 's/^- //')
          SUBTITLE=$(echo "$FIRST" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')
          if [[ -n "$SUBTITLE" ]]; then
            TITLE="${TAG} — ${SUBTITLE}"
          else
            TITLE="${TAG}"
          fi

          {
            echo "**Install:** \`pip install pyoas==${VERSION}\` · \`uv add pyoas==${VERSION}\`"
            echo ""
            echo "---"
            echo ""
            echo "$BODY"
          } > /tmp/release_notes.md

          echo "RELEASE_TITLE=${TITLE}" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/release_notes.md \
            --verify-tag
